<style>
:root{--ink:#111827;--mut:#6B7280;--line:#E5E7EB;--soft:#F9FAFB}
*{-webkit-tap-highlight-color:transparent}
body{background:#fff;color:var(--ink);font-family:'Segoe UI','Noto Sans Arabic',Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.55}
.font-black{font-weight:700!important}.font-bold{font-weight:600!important}
.nb{border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(17,24,39,.04)}
.pk,.or,.gr{background:var(--soft)}.bl,.pu,.ye{background:#F3F4F6}
.nb.rd{background:#FEF2F2;border-color:#FECACA}
.btn{border:1px solid var(--ink);border-radius:8px;padding:.5rem 1rem;font-weight:600;cursor:pointer;transition:.15s;background:var(--ink);color:#fff;font-size:.9rem}
.btn:hover{background:#374151;border-color:#374151}.btn:active{transform:scale(.98)}
.btn.pk,.btn.bl,.btn.or,.btn.pu,.btn.bg-white{background:#fff!important;color:var(--ink);border-color:#D1D5DB}
.btn.pk:hover,.btn.bl:hover,.btn.or:hover,.btn.pu:hover,.btn.bg-white:hover{background:#F3F4F6!important}
.btn.gr,.btn.ye{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.rd{background:#fff!important;color:#B91C1C;border-color:#FCA5A5}
.btn.rd:hover{background:#FEF2F2!important}
.inp{border:1px solid #D1D5DB;border-radius:8px;padding:.5rem .75rem;width:100%;background:#fff;font-size:.92rem}
.inp:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(17,24,39,.08)}
.inp:disabled{background:#F3F4F6;color:var(--mut)}
@keyframes pulseRed{0%,100%{background:#FEE2E2;box-shadow:0 0 0 0 rgba(220,38,38,.35)}50%{background:#FECACA;box-shadow:0 0 14px 4px rgba(220,38,38,.3)}}
.alert{animation:pulseRed 1s infinite;border-color:#DC2626}
.nav{display:block;padding:.5rem .8rem;border-radius:8px;font-weight:600;color:#374151;cursor:pointer;font-size:.92rem;white-space:nowrap}
.nav:hover{background:#F3F4F6}.nav.on{background:var(--ink);color:#fff}
.navg{font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--mut);margin:1rem .8rem .3rem;text-transform:uppercase}
[style*="height:14px"]{background:var(--ink)!important}.rd[style*="height:14px"]{background:#B91C1C!important}
#toast{background:var(--ink)!important;color:#fff;border-color:var(--ink)}
h1,h2,h3{letter-spacing:-.01em}
html{font-size:clamp(14px,.55vw + 10px,24px)}
body{padding:0;margin:0}
.login-wrap{max-width:30rem;margin:0 auto;padding:1.5rem 1rem}
.shell{display:flex;min-height:100vh}
.side{display:none;width:15.5rem;flex-shrink:0;background:#0B0B0C;color:#D4D4D8;position:sticky;top:0;height:100vh;overflow:auto;padding:1.1rem .75rem}
.side .nav{color:#A1A1AA}.side .nav:hover{background:#18181B;color:#fff}.side .nav.on{background:#fff;color:#0B0B0C}
.side .navg{color:#71717A}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid #E5E7EB;padding:.7rem 1rem;padding-top:calc(.7rem + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.content{padding:1rem 1rem 6.5rem}
.bottom{position:fixed;bottom:0;inset-inline:0;background:#0B0B0C;display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px)}
.bottom a{flex:1;text-align:center;padding:.85rem .2rem;color:#A1A1AA;font-size:.78rem;font-weight:600;cursor:pointer}
.bottom a.on{color:#fff;box-shadow:inset 0 3px 0 #fff}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5)}
.sheet>div{position:absolute;bottom:0;inset-inline:0;background:#fff;border-radius:16px 16px 0 0;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
#toast{bottom:5.5rem!important}
@media(min-width:768px){.side{display:block}.bottom{display:none}.content{padding:1.5rem 2rem 2.5rem}#toast{bottom:1.5rem!important}}
@media(min-width:1536px){.md\:grid-cols-2{grid-template-columns:repeat(3,minmax(0,1fr))}.lg\:grid-cols-3{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:2200px){.md\:grid-cols-2{grid-template-columns:repeat(4,minmax(0,1fr))}}

:root{color-scheme:light}
html,body,.shell,.main-col,.content{background:#fff;color:var(--ink)}
body{font-variant-numeric:tabular-nums}

html{font-size:13px}

#toast{bottom:.8rem!important}

}

/* ---------- State ---------- */
let S=SS.get('amaya_state',{lang:'ar',runners:[],breaks:{},broken:[],delays:[],session:null});
S.blog=S.blog||[];S.chat=S.chat||[];S.assign=S.assign||{};S.mgrs=S.mgrs||[];S.absences=S.absences||[];S.att=S.att||[];S.pts=S.pts||[];S.log=S.log||[];S.sched=S.sched||{};S.cfg=S.cfg||{};S.shifts=(S.shifts&&S.shifts.length)?S.shifts:DEFSH();S.notes=S.notes||[];S.runners=S.runners||[];S.breaks=S.breaks||{};S.broken=S.broken||[];S.delays=S.delays||[];
let tab='breaks',pendingPhoto='',selChar=0,loginErr=false;
const save=()=>{SS.set('amaya_state',S);push()};
const t=k=>L[S.lang][k];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const chName=()=>'';
const isOwner=()=>S.session&&S.session.role==='owner';
const me=()=>S.runners.find(r=>r.id===S.session.id);
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2500)}
function setLang(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr'}
function toggleLang(){S.lang=S.lang==='ar'?'en':'ar';save();render()}

/* ---------- Auth ---------- */
function doLogin(){
 const u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value;
 if(u==='abdurhman'&&p==='121212'){S.session={role:'owner'};tab='dash'}
 else if(S.mgrs.find(m=>m.user===u&&m.pass===p)){S.session={role:'mgr',id:S.mgrs.find(m=>m.user===u&&m.pass===p).id};tab='dash'}else{const r=S.runners.find(r=>r.user===u&&r.pass===p&&!r.off);if(r){S.session={role:'runner',id:r.id};tab='me'}else{loginErr=true;return render()}}
 loginErr=false;save();render();
}
function logout(){S.session=null;save();render()}

/* ---------- Runners ---------- */
function addRunner(){
 const n=document.getElementById('rn').value.trim(),u=document.getElementById('ru').value.trim(),p=document.getElementById('rp').value.trim();
 if(!n||!u||!p)return toast('');
 if(u==='abdurhman'||S.runners.some(r=>r.user===u))return toast(' username');
 S.runners.push({id:'r'+Date.now(),name:n,user:u,pass:p,phone:(document.getElementById('rph').value||'').trim(),salary:parseInt(document.getElementById('rsal').value)||700000,photo:pendRP,pv:Date.now()});pendRP='';save();render();
}
function pickChar(i){selChar=i;render()}

/* ---------- Breaks ---------- */
function startBreak(id){
 const m=parseInt(document.getElementById('m_'+id).value);if(!m||m<1)return toast('');
 S.breaks[id]={start:Date.now(),mins:m};save();render();
}
function endBreak(id){
 const b=S.breaks[id],r=S.runners.find(x=>x.id===id);
 if(b){const over=Date.now()-(b.start+b.mins*60000);
  if(over>0&&r)S.delays.unshift({name:r.name,char:r.char,late:Math.ceil(over/60000),at:Date.now()});
  if(r)S.blog.push({rid:id,name:r.name,char:r.char,mins:b.mins,used:Math.round((Date.now()-b.start)/60000),late:Math.max(0,Math.ceil(over/60000)),at:Date.now()})}
 delete S.breaks[id];save();render();
}
function tick(){
 const now=Date.now();
 document.querySelectorAll('[data-end]').forEach(el=>{
  const d=+el.dataset.end-now,id=el.dataset.id,card=document.getElementById('c_'+id),lb=document.getElementById('l_'+id);
  const f=ms=>{const s=Math.floor(Math.abs(ms)/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
  if(d>=0){el.textContent=f(d);if(lb)lb.textContent=t('left');card&&card.classList.remove('alert');delete ALR[id];if(d<60000&&!WRN[id]){WRN[id]=1;beep(1)}}
  else{el.textContent='+'+f(d);if(lb)lb.textContent=' '+t('late')+' '+Math.ceil(-d/60000)+' '+t('lateMin');card&&card.classList.add('alert');if(!ALR[id]){ALR[id]=1;beep();try{if(isStaff()&&window.Notification&&Notification.permission==='granted')new Notification('Amaya Heroes',{body:nm(id)+' - '+t('late')})}catch(e){}}}
 });
}
setInterval(tick,1000);

/* ---------- Broken log ---------- */
function onPhoto(inp){
 const f=inp.files[0];if(!f)return;
 const rd=new FileReader();rd.onload=e=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  pendingPhoto=c.toDataURL('image/jpeg',.7);const pv=document.getElementById('pv');pv.src=pendingPhoto;pv.classList.remove('hidden')};im.src=e.target.result};
 rd.readAsDataURL(f);
}
function addBroken(){
 const idx=+document.getElementById('bi').value,q=parseInt(document.getElementById('bq').value)||1;
 const other=document.getElementById('bo').value.trim(),who=document.getElementById('bw').value,note=document.getElementById('bn').value.trim();
 if(idx===4&&!other)return toast(' '+t('other'));
 S.broken.unshift({id:'b'+Date.now(),item:idx,other,qty:q,who,note,photo:pendingPhoto,at:Date.now()});
 pendingPhoto='';save();render();
}
function showImg(id){const b=S.broken.find(x=>x.id===id);if(!b||!b.photo)return;document.getElementById('modalImg').src=b.photo;document.getElementById('modal').classList.remove('hidden')}
const itemName=b=>b.item===4&&b.other?b.other:L[S.lang].items[b.item];
const whoName=b=>{const r=S.runners.find(x=>x.id===b.who);return r?r.name:'-'};

async function saveFile(name,blob){try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:name,data:blob});return}}}catch(e){if(e&&e.code==='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function exportXlsx(){
 try{await loadExcel()}catch(e){return toast('ExcelJS load failed')}
 try{
  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Breakage',{views:[{rightToLeft:S.lang==='ar'}]});
  const H=S.lang==='ar'?['#','الصنف','العدد','الرنر','ملاحظة','التاريخ والوقت','الصورة']:['#','Item','Qty','Runner','Note','Date & Time','Photo'];
  ws.columns=[{width:6},{width:24},{width:8},{width:18},{width:30},{width:24},{width:18}];
  const hr=ws.addRow(H);hr.eachCell(c=>{c.font={bold:true};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFD93D'}};c.border={top:{style:'medium'},bottom:{style:'medium'},left:{style:'medium'},right:{style:'medium'}};c.alignment={horizontal:'center'}});
  S.broken.forEach((b,i)=>{
   const r=ws.addRow([i+1,itemName(b),b.qty,whoName(b),b.note,fmt(b.at),b.photo?'':'-']);
   r.alignment={vertical:'middle',horizontal:'center',wrapText:true};
   if(b.photo){r.height=75;const id=wb.addImage({base64:b.photo,extension:'jpeg'});ws.addImage(id,{tl:{col:6.1,row:i+1.1},ext:{width:90,height:90}})}
  });
  const buf=await wb.xlsx.writeBuffer();await saveFile('amaya-breakage-'+new Date().toISOString().slice(0,10)+'.xlsx',new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));toast(' Excel');
 }catch(e){toast(' '+e.message)}
}

function markAbsent(rid,dk){if((S.absences||[]).some(a=>a.rid===rid&&a.day===dk))return toast(T('الغياب مسجل مسبقاً','Already recorded'));dlg({title:T('تسجيل غياب','Record absence'),msg:nm(rid)+' - '+dk,fields:[{id:'rs',label:T('سبب الغياب','Reason for absence')}],ok:T('تسجيل','Record'),fn:f=>{S.absences=S.absences||[];S.absences.push({id:'ab'+Date.now()+Math.random().toString(36).slice(2,5),rid,day:dk,at:Date.now(),reason:(f.rs||'').trim()});logAct(LX(()=>T('غياب ','absent ')+nm(rid)+' '+dk));save();render()}})}
function undoAbsent(aid){S.absences=(S.absences||[]).filter(a=>a.id!==aid);logAct('undo absence');save();render()}
function absTd(x){if(x.r.off)return '<td class="p-2"></td>';const dk=new Date(DD).toLocaleDateString('en-CA');const ab=(S.absences||[]).find(a=>a.rid===x.r.id&&a.day===dk);
 return `<td class="p-2 whitespace-nowrap">${ab?`<span class="pill bad">${T('غياب مسجل','Absence recorded')}</span> <button class="btn bg-white !py-1" onclick="undoAbsent('${ab.id}')">${T('إلغاء','Undo')}</button>`:`<button class="btn bg-white !py-1" onclick="markAbsent('${x.r.id}','${dk}')">${T('تسجيل غياب','Mark absent')}</button>`}</td>`}
const IQD=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2})+' '+T('د.ع','IQD');
function salRows(ym){return S.runners.map(r=>{const ab=(S.absences||[]).filter(a=>a.rid===r.id&&a.day.startsWith(ym)).sort((a,b)=>a.day<b.day?-1:1);const sal=Number(r.salary)||700000,daily=Math.round(sal*100/SAL_DIV)/100,ded=Math.round(sal*ab.length*100/SAL_DIV)/100,net=Math.max(0,Math.round((sal-ded)*100)/100);return{r,ab,sal,daily,ded,net}})}
function vSalary(){const rows=salRows(SM),tot=rows.reduce((a,x)=>a+x.net,0),ded=rows.reduce((a,x)=>a+x.ded,0);
 const box=(l,v)=>`<div class="nb p-4"><div class="text-xs font-bold text-gray-500">${l}</div><div class="text-xl font-bold">${v}</div></div>`;
 return `<div class="flex flex-wrap items-end justify-between gap-3 mb-4"><div class="w-44"><label class="text-xs font-bold">${T('الشهر','Month')}</label><input type="month" class="inp" value="${SM}" onchange="SM=this.value;render()"></div><button class="btn" onclick="exportSalaries('')">${T('تصدير كشف الرواتب (Excel)','Export salaries (Excel)')}</button></div>
 <div class="grid grid-cols-3 gap-3 mb-4">${box(T('إجمالي الصافي','Total net'),IQD(tot))}${box(T('إجمالي الخصومات','Total deductions'),IQD(ded))}${box(T('عدد الرنرات','Runners'),rows.length)}</div>
 <div class="nb overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-gray-500 border-b border-gray-200"><th class="p-3 text-start">${T('الرنر','Runner')}</th><th class="p-3 text-start">${T('الهاتف','Phone')}</th><th class="p-3 text-center">${T('الراتب','Salary')}</th><th class="p-3 text-center">${T('الغيابات','Absences')}</th><th class="p-3 text-center">${T('الخصم','Deduction')}</th><th class="p-3 text-center">${T('الصافي','Net')}</th><th class="p-3"></th></tr></thead><tbody>${rows.map(x=>`<tr class="border-b border-gray-100"><td class="p-3 font-semibold">${avImg(x.r,26)} ${esc(x.r.name)}</td><td class="p-3">${esc(x.r.phone||'-')}</td><td class="p-3 text-center">${IQD(x.sal)}</td><td class="p-3 text-center">${x.ab.length}</td><td class="p-3 text-center ${x.ded?'text-red-700 font-bold':''}">${IQD(x.ded)}</td><td class="p-3 text-center font-bold">${IQD(x.net)}</td><td class="p-3"><button class="btn bg-white !py-1" onclick="exportSalaries('${x.r.id}')">${T('كشف Excel','Slip Excel')}</button></td></tr>`).join('')||`<tr><td colspan="7" class="p-6 text-center text-gray-500">${T('لا يوجد رنرات','No runners')}</td></tr>`}</tbody></table></div>
 <div class="text-sm text-gray-500 mt-3">${T('اليومية = الراتب ÷ 30. يُخصم يوم واحد عن كل غياب مسجل فقط. النقاط والخصومات الأخرى لا تُخصم من الراتب.','Daily rate = salary / 30. One day is deducted per recorded absence only. Points do not affect salary.')}</div>`}
async function exportSalaries(rid){try{await loadExcel()}catch(e){return toast(T('تعذّر تحميل ملف Excel','Could not load Excel'))}
 const rows=salRows(SM).filter(x=>!rid||x.r.id===rid);if(!rows.length)return toast(T('لا توجد بيانات','No data'));
 const rtl=S.lang==='ar',stamp=new Date().toLocaleString('en-GB'),wb=new ExcelJS.Workbook();
 const hdr=(ws,arr)=>{const h=ws.addRow(arr);h.eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF111827'}};c.alignment={horizontal:'center',vertical:'middle'}})};
 const ws=wb.addWorksheet(T('كشف الراتب','Salary slip'),{views:[{rightToLeft:rtl}]});
 ws.columns=[{width:22},{width:16},{width:16},{width:12},{width:16},{width:16},{width:16}];
 ws.addRow(['Amaya Heroes - '+T('كشف الرواتب','Salary statement')+' - '+SM]).font={bold:true,size:13};
 ws.addRow([T('تاريخ ووقت الإصدار','Generated at'),stamp]);ws.addRow([]);
 hdr(ws,T(['الرنر','الهاتف','الراتب','الغيابات','الخصم','الصافي','اليومية'],['Runner','Phone','Salary','Absences','Deduction','Net','Daily rate']));
 const tt=[0,0,0];
 rows.forEach(x=>{const r=ws.addRow([x.r.name,x.r.phone||'-',x.sal,x.ab.length,x.ded,x.net,x.daily]);const rn=r.number;r.getCell(5).value={formula:`ROUND(C${rn}*D${rn}/${SAL_DIV},2)`,result:x.ded};r.getCell(6).value={formula:`C${rn}-E${rn}`,result:x.net};r.getCell(7).value={formula:`ROUND(C${rn}/${SAL_DIV},2)`,result:x.daily};[3,5,6,7].forEach(k=>r.getCell(k).numFmt='#,##0.00');r.alignment={horizontal:'center'};tt[0]+=x.sal;tt[1]+=x.ded;tt[2]+=x.net;if(x.ded)r.eachCell(c=>{c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFEE2E2'}}})});
 if(rows.length>1){const tr=ws.addRow([T('الإجمالي','Total'),'',tt[0],'',tt[1],tt[2],'']);tr.font={bold:true};tr.eachCell(c=>{c.alignment={horizontal:'center'}})}
 const wa=wb.addWorksheet(T('الغيابات','Absences'),{views:[{rightToLeft:rtl}]});
 wa.columns=[{width:22},{width:14},{width:22},{width:14}];
 hdr(wa,T(['الرنر','التاريخ','وقت التسجيل','اليوم'],['Runner','Date','Recorded at','Day']));
 rows.forEach(x=>x.ab.forEach(a=>{const dt=new Date(a.at),dd=new Date(a.day+'T00:00:00');wa.addRow([x.r.name,a.day,dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+' '+dt.toLocaleDateString('en-CA'),DAYS()[dd.getDay()]]).alignment={horizontal:'center'}}));
 rows.forEach(x=>addReceipt(wb,x,rtl,stamp));
 const name='amaya-salary-'+SM+(rid?'-'+nm(rid):'')+'.xlsx',buf=await wb.xlsx.writeBuffer(),bl=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),f=new File([bl],name,{type:bl.type});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e.name==='AbortError')return}
 await saveFile(name,bl);toast(T('تم تصدير الملف','File exported'));}

/* ---------- Runner salary view ---------- */
function runnerSalary(r){const ym=SM,row=salRows(ym).find(x=>x.r.id===r.id)||{sal:Number(r.salary)||700000,ab:[],ded:0,net:Number(r.salary)||700000,daily:Math.round((Number(r.salary)||700000)*100/SAL_DIV)/100};
 const box=(l,v,c)=>`<div class="nb p-4 ${c||''}"><div class="text-xs font-bold text-gray-500">${l}</div><div class="text-xl font-bold">${v}</div></div>`;
 const days=row.ab.map(a=>`<div class="flex justify-between py-1 border-b border-gray-100"><span>${a.day}</span><span class="text-gray-500">${DAYS()[new Date(a.day+'T00:00:00').getDay()]}${a.reason?' - '+esc(a.reason):''}</span></div>`).join('');
 return `<div class="text-sm text-gray-500 mb-3">${T('الشهر','Month')}: ${ym}</div><div class="grid grid-cols-2 gap-3 mb-4">${box(T('راتبك الشهري','Monthly salary'),IQD(row.sal))}${box(T('يومية الراتب','Daily rate'),IQD(row.daily))}${box(T('أيام الغياب','Absent days'),row.ab.length)}${box(T('الخصم','Deduction'),IQD(row.ded),row.ded?'bg-red-50':'')}</div>
 <div class="nb p-5 text-center mb-4"><div class="text-sm text-gray-500">${T('الصافي هذا الشهر','Net this month')}</div><div class="text-3xl font-bold">${IQD(row.net)}</div></div>
 <div class="nb p-4"><div class="font-bold mb-2">${T('أيام الغياب','Absence days')}</div>${days||`<div class="text-gray-500">${T('لا غياب هذا الشهر','No absences this month')}</div>`}</div>
 <div class="text-xs text-gray-500 mt-3">${T('الخصم = الراتب ÷ 30 لكل يوم غياب، ولا تُخصم أي نقاط من الراتب.','Deduction = salary ÷ 30 per absent day. Points never affect salary.')}</div>`}

/* ---------- Salary receipt (وصل قبض) per runner ---------- */
function addReceipt(wb,x,rtl,stamp){
 const base=(x.r.name||'Runner').replace(/[\[\]\*\?\/\\:]/g,'').slice(0,22);
 const ws=wb.addWorksheet((T('وصل ','Receipt ')+base).slice(0,31),{views:[{rightToLeft:rtl}]});
 ws.columns=[{width:26},{width:16},{width:34},{width:18}];
 ws.addRow([T('وصل قبض راتب','Salary receipt')]).font={bold:true,size:14};
 ws.addRow([T('الشهر','Month'),SM]);
 ws.addRow([T('الرنر','Runner'),x.r.name]);
 ws.addRow([T('الهاتف','Phone'),x.r.phone||'-']);
 ws.addRow([T('الراتب الشهري','Monthly salary'),x.sal]).getCell(2).numFmt='#,##0.00';
 ws.addRow([T('يومية الراتب (÷30)','Daily rate (÷30)'),{formula:`ROUND(B5/${SAL_DIV},2)`,result:x.daily}]).getCell(2).numFmt='#,##0.00';
 ws.addRow([]);
 const h=ws.addRow(T(['التاريخ','اليوم','سبب الغياب','الخصم'],['Date','Day','Reason','Deduction']));
 h.eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF111827'}};c.alignment={horizontal:'center'}});
 const abs=x.ab.slice().sort((a,b)=>a.day<b.day?-1:1);
 abs.forEach((a,i)=>{const dd=new Date(a.day+'T00:00:00');const c1=Math.round(x.sal*(i+1)*100/SAL_DIV)/100,c0=Math.round(x.sal*i*100/SAL_DIV)/100;
  const r=ws.addRow([a.day,DAYS()[dd.getDay()],a.reason||T('غير مذكور','Not specified'),Math.round((c1-c0)*100)/100]);r.getCell(4).numFmt='#,##0.00';r.alignment={horizontal:'center'};});
 if(!abs.length){const r=ws.addRow(['-','-',T('لا غياب هذا الشهر','No absences this month'),0]);r.getCell(4).numFmt='#,##0.00';r.alignment={horizontal:'center'};}
 ws.addRow([]);
 const tot=ws.addRow([T('إجمالي الخصم','Total deduction'),'','',{formula:`ROUND(B5*${abs.length}/${SAL_DIV},2)`,result:x.ded}]);tot.getCell(4).numFmt='#,##0.00';tot.font={bold:true};
 const net=ws.addRow([T('الصافي المستلم','Net received'),'','',{formula:`B5-D${tot.number}`,result:x.net}]);net.getCell(4).numFmt='#,##0.00';net.font={bold:true,size:13};
 ws.addRow([]);
 ws.addRow([T('أقر أنا الموقع أدناه باستلام المبلغ أعلاه.','I confirm receiving the amount above.')]);
 ws.addRow([]);ws.addRow([]);
 ws.addRow([T('توقيع الرنر','Runner signature'),'','',T('توقيع المدير','Manager signature')]);
 ws.addRow([]);
 ws.addRow([T('وقت الإصدار','Issued at'),stamp]);
}

/* ---------- Render ---------- */
function render(){
 setLang();const app=document.getElementById('app');
 if(!S.session){app.innerHTML='<div class="login-wrap">'+vLogin()+'</div>'+dlgHtml();return}
 let tabs,body;
 if(isStaff()){
  tabs=[['dash','tDash'],['notes','tNotes'],['breaks','tBreaks'],['shifts','tShifts'],['assign','tAssign'],['scores','tScore'],['stats','tStats'],['report','tReport'],['daily','tDaily'],['chat','tChat']].concat(isOwner()?[['salary','tSalary'],['broken','tBroken'],['runners','tRun'],['settings','tSet'],['log','tLog'],['rules','tRules']]:[['rules','tRules']]);
  body={salary:vSalary,notes:vNotes,daily:vDaily,dash:vDash,shifts:vShifts,settings:vSettings,scores:vScores,stats:vStats,log:vLog,breaks:vBreaks,assign:vAssign,report:vReport,chat:vChat,broken:vBroken,runners:vRunners,rules:vRules}[tab]||vBreaks;
 }else{tabs=[['me','tMe']];tab='me';body=runnerRoot}
 const G={me:0,salary:2,notes:0,dash:0,breaks:0,shifts:0,assign:0,chat:0,runners:1,scores:1,stats:2,report:2,daily:2,broken:2,log:2,settings:3,rules:3},GL=[T('التشغيل','Operations'),T('الفريق','Team'),T('التقارير','Reports'),T('النظام','System')];
 const lab=x=>t(x[1])||x[1],cur=tabs.find(x=>x[0]===tab)||tabs[0];
 const side=GL.map((g,i)=>{const it=tabs.filter(x=>G[x[0]]===i);return it.length?`<div class="navg">${g}</div>`+it.map(x=>`<a class="nav ${tab===x[0]?'on':''}" onclick="go('${x[0]}')">${lab(x)}</a>`).join(''):''}).join('');
 const prim=tabs.length<=2?tabs:tabs.filter(x=>['dash','breaks','shifts','daily'].includes(x[0]));
 const bot=prim.map(x=>`<a class="${tab===x[0]?'on':''}" onclick="go('${x[0]}')">${lab(x)}</a>`).join('')+(tabs.length>2?`<a onclick="MORE=true;render()">${T('المزيد','More')}</a>`:'');
  const sheet=MORE?`<div class="sheet" onclick="MORE=false;render()"><div onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-1"><div class="font-bold text-lg">${T('الأقسام','Sections')}</div><button class="btn bg-white !py-1" onclick="MORE=false;render()">${T('إغلاق','Close')}</button></div>${GL.map((g,i)=>{const it=tabs.filter(x=>G[x[0]]===i);return it.length?`<div class="text-xs font-bold text-gray-500 mt-3 mb-1">${g}</div><div class="grid grid-cols-2 gap-2">${it.map(x=>`<button class="btn ${tab===x[0]?'':'bg-white'}" onclick="go('${x[0]}')">${lab(x)}</button>`).join('')}</div>`:''}).join('')}</div></div>`:'';
 app.innerHTML=`<div class="shell"><aside class="side"><div class="flex items-center gap-3 px-2 pb-4 mb-2 border-b border-zinc-800"><div class="brand">AH</div><div><div class="font-bold text-white leading-tight">${t('app')}</div><div class="text-xs text-zinc-500">${esc((S.cfg&&S.cfg.name)||t('sub'))}</div></div></div>${side}<div class="usercard"><div class="text-white font-semibold">${esc(S.session.role==='runner'?(me()||{}).name:meName())}</div><div class="mb-2">${S.session.role==='owner'?T('المدير','Manager'):S.session.role==='mgr'?T('مدير مناوب','Shift manager'):T('رنر','Runner')}</div><a class="nav" onclick="logout()">${t('logout')}</a></div></aside><div class="main-col"><div class="topbar"><button class="burger" onclick="MORE=true;render()" aria-label="menu"><i></i><i></i><i></i></button><div class="font-bold text-lg truncate md:hidden">${lab(cur)}</div><div class="hidden md:block text-sm text-gray-500">${new Date().toLocaleDateString(S.lang==='ar'?'ar-IQ-u-nu-latn':'en-GB',{weekday:'long',day:'numeric',month:'long'})}</div><div class="flex items-center gap-2"><span class="text-xs font-semibold px-2 py-1 rounded-full border border-gray-300">${navigator.onLine?(DB?(dbErr?T('خطأ مزامنة','Sync error'):dbOk?T('متصل','Online'):'...'):T('محلي','Local')):T('بدون إنترنت','Offline')}</span><span class="text-sm text-gray-500 hidden md:inline">${esc(S.session.role==='runner'?(me()||{}).name:meName())}</span><button class="btn bg-white" onclick="toggleLang()">AR | EN</button><button class="btn" onclick="logout()">${t('logout')}</button></div></div><main class="content"><div class="mb-5"><h1 class="text-2xl font-bold tracking-tight">${lab(cur)}</h1><p class="text-sm text-gray-500">${DESC()[cur[0]]||''}</p></div>${body()}</main></div>${sheet}${profSheet()}${notesSheet()}${dlgHtml()}</div>`;
 tick();
}
{const _rr=render;render=function(){try{_rr()}catch(e){console.error(e);toast('Error: '+(e&&e.message?e.message:e))}}}
render();
if(DB){initReset().then(()=>{pull();setInterval(pull,8000)})}
if(S.session&&window.Notification&&Notification.permission==='granted'&&(S.session.role!=='runner'||notifOn(S.session.id)))enablePush();
</script>
